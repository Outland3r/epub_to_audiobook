services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    environment:
      USE_GPU: "true"
    ports:
      - "127.0.0.1:8880:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  converter:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      OPENAI_BASE_URL: http://kokoro:8880/v1
      OPENAI_API_KEY: not-needed
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      KOKORO_UI: "1"
    ports:
      - "7860:7860"
    volumes:
      - ../:/app
    command: ["python3", "/app_src/main_ui.py", "--host", "0.0.0.0", "--port", "7860"]
    depends_on:
      kokoro:
        condition: service_healthy